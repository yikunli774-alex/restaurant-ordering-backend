name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Runs unit + real-MySQL integration tests (Testcontainers) and packages the jar.
      # GitHub's ubuntu runners provide Docker, so the MySQL container starts fine.
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Validate Compose model
        run: docker compose config --quiet

      # The Dockerfile copies the jar produced by the verify step above.
      # GitHub's path is ASCII, so the default BuildKit builder works here.
      - name: Build application image
        run: docker build --tag restaurant-ordering:${{ github.sha }} .
