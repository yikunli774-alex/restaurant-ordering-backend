spring:
  application:
    name: restaurant-ordering-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/restaurant_ordering?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:ordering}
    password: ${DB_PASSWORD:ordering}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

security:
  jwt:
    # HS256 needs a key of at least 32 bytes. Override JWT_SECRET in real deployments.
    secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-please-0123456789}
    access-ttl-seconds: ${JWT_ACCESS_TTL:900}
  session:
    ttl-seconds: ${SESSION_TTL:900}
  table-code:
    secret: ${TABLE_CODE_SECRET:dev-only-insecure-table-code-secret-change-me-0123456789}
  bootstrap:
    manager-username: ${BOOTSTRAP_MANAGER_USERNAME:manager}
    manager-password: ${BOOTSTRAP_MANAGER_PASSWORD:manager123}
    kitchen-username: ${BOOTSTRAP_KITCHEN_USERNAME:kitchen}
    kitchen-password: ${BOOTSTRAP_KITCHEN_PASSWORD:kitchen123}

cart:
  ttl-seconds: ${CART_TTL:14400}
